name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack Reel Counter project
        run: |
          base64 -d "reelcounter-project (1).txt" > project.tgz
          tar xzf project.tgz
      - name: Download AI model
        run: |
          mkdir -p ReelCounter/app/src/main/assets
          curl -fsSL -o ReelCounter/app/src/main/assets/nsfw.tflite \
            https://raw.githubusercontent.com/devzwy/open_nsfw_android/master/data/nsfw2.tflite
          echo "eb3b446a6a8c1a73998a76011b97cfc67bc01084c63ee195c774e71344a66442  ReelCounter/app/src/main/assets/nsfw.tflite" | sha256sum -c -
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build APK
        working-directory: ReelCounter
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ReelCounter-apk
          path: ReelCounter/app/build/outputs/apk/debug/app-debug.apk
