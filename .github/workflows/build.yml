name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack Reel Counter project
        run: |
          # Uses the one reelcounter-project*.txt file, whatever the phone named it
          shopt -s nullglob
          files=(reelcounter-project*.txt)
          if [ ${#files[@]} -ne 1 ]; then
            echo "Keep exactly ONE reelcounter-project*.txt file in the repo. Found: ${files[*]}"
            exit 1
          fi
          echo "Using: ${files[0]}"
          base64 -d "${files[0]}" > project.tgz
          tar xzf project.tgz
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build AI model (TinyCLIP, MIT licence)
        run: |
          pip install torch==2.15.0 torchvision==0.29.2 onnx==1.23.2 onnxruntime==1.29.0 \
            ftfy regex tqdm huggingface_hub psutil numpy
          git clone -q https://github.com/wkcn/TinyCLIP.git /tmp/TinyCLIP
          git -C /tmp/TinyCLIP checkout -q ad981bf308f007c4a47c1b34786cc90bbfd2c43c
          mkdir -p ~/.cache/clip
          CKPT=~/.cache/clip/TinyCLIP-auto-ViT-45M-32-Text-18M-LAIONYFCC400M.pt
          curl -fsSL -o $CKPT \
            https://github.com/wkcn/TinyCLIP-model-zoo/releases/download/checkpoints/TinyCLIP-auto-ViT-45M-32-Text-18M-LAIONYFCC400M.pt
          echo "da460de77a27162d279f98566df1b4fbd25a38cbd23b69ede15c5db13debb368  $CKPT" | sha256sum -c -
          mkdir -p ReelCounter/app/src/main/assets
          PYTHONPATH=/tmp/TinyCLIP/src python ReelCounter/tools/build_model.py ReelCounter/app/src/main/assets/clip.onnx
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build APK
        working-directory: ReelCounter
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ReelCounter-apk
          path: ReelCounter/app/build/outputs/apk/debug/app-debug.apk
